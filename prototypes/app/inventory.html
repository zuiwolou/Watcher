<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APP · 盘点扫码</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="desk-bar">
    <div>
      <h1>APP · 库存盘点扫码（执行）</h1>
      <p>领取后台下发的盘点任务，现场连续扫码实盘</p>
    </div>
    <nav class="nav-pills">
      <a href="../index.html">总览</a>
      <a href="index.html">APP首页</a>
      <a href="checkin.html">打卡</a>
      <a class="active" href="inventory.html">盘点</a>
      <a href="scan-io.html">入出库</a>
    </nav>
  </div>
  <div class="stage">
    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar"><span>15:20</span><span class="icons">5G · 86%</span></div>
        <div class="app-header">
          <a class="back" href="index.html">←</a>
          <h2>盘点扫码</h2>
        </div>
        <div class="content">
          <div class="card">
            <div class="row">
              <h4 style="margin:0">PD-20261015-01</h4>
              <span class="badge info">进行中</span>
            </div>
            <div class="meta">东区 A01 · 后台创建并下发 · 应盘 128</div>
            <div class="progress-bar"><span style="width:75%"></span></div>
            <div class="meta">已盘 96 · 差异 2</div>
          </div>
          <div class="scan-frame" style="aspect-ratio:16/11">
            <div class="box" style="width:42%"></div>
            <p>连续扫描危废唯一码</p>
          </div>
          <div class="card">
            <div class="list-item">
              <div class="avatar" style="background:#dcfce7;color:#15803d">符</div>
              <div style="flex:1"><strong style="font-size:.82rem">…00088</strong><div class="meta">相符</div></div>
              <span class="badge ok">OK</span>
            </div>
            <div class="list-item">
              <div class="avatar" style="background:#fef2f2;color:#b91c1c">亏</div>
              <div style="flex:1"><strong style="font-size:.82rem">…00021</strong><div class="meta">账面有 · 未扫到</div></div>
              <span class="badge danger">盘亏</span>
            </div>
            <button class="btn btn-primary" style="margin-top:8px" data-toast="实盘已提交，后台可生成报表">提交实盘</button>
          </div>
        </div>
        <nav class="tabbar">
          <a href="index.html"><div class="ico">⌂</div>首页</a>
          <a class="active" href="checkin.html"><div class="ico">执</div>执行</a>
          <a href="tracking.html"><div class="ico">运</div>定位</a>
          <a href="monitor.html"><div class="ico">监</div>监测</a>
          <a href="alarms.html"><div class="ico">警</div>告警</a>
        </nav>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
