<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APP · 物资查询</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="desk-bar">
    <div><h1>APP · 物资查询（只读）</h1><p>多维筛选查看在库情况，不可编辑。</p></div>
    <nav class="nav-pills">
      <a href="../index.html">总览</a>
      <a href="index.html">APP首页</a>
      <a class="active" href="materials.html">物资</a>
      <a href="alarms.html">告警</a>
      <a href="monitor.html">监测</a>
      <a href="tracking.html">定位</a>
      <a href="geofence.html">围栏</a>
    </nav>
  </div>
  <div class="stage">
    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar"><span>15:02</span><span class="icons">5G · 86%</span></div>
        <div class="app-header">
          <a class="back" href="index.html">←</a>
          <h2>物资查询</h2>
          <span class="action" style="color:var(--muted)">只读</span>
        </div>
        <div class="content">
          <div class="field"><input placeholder="唯一码 / 库位" /></div>
          <div class="chips"><span class="chip on">在库</span><span class="chip">A01</span><span class="chip">库龄&gt;30天</span></div>
          <div class="card">
            <div class="list-item">
              <div class="avatar">铅</div>
              <div style="flex:1">
                <div class="row"><strong style="font-size:.82rem">HW31-…-00088</strong><span class="badge warn">25d</span></div>
                <div class="meta">0.036t · B-02-06 · 在库</div>
              </div>
            </div>
            <div class="list-item">
              <div class="avatar">铅</div>
              <div style="flex:1">
                <div class="row"><strong style="font-size:.82rem">HW31-…-00102</strong><span class="badge ok">14d</span></div>
                <div class="meta">0.034t · A-03-12 · 在库</div>
              </div>
            </div>
          </div>
          <p style="font-size:.72rem;color:var(--muted);text-align:center">录入与开单请使用网页后台</p>
        </div>
        <nav class="tabbar">
          <a href="index.html"><div class="ico">⌂</div>首页</a>
          <a class="active" href="materials.html"><div class="ico">物</div>物资</a>
          <a href="tracking.html"><div class="ico">运</div>定位</a>
          <a href="monitor.html"><div class="ico">监</div>监测</a>
          <a href="alarms.html"><div class="ico">警</div>告警</a>
        </nav>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
