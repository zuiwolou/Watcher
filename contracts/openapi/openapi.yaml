        - $ref: "#/components/parameters/XClientAny"
      responses:
        "200":
          description: OK

  /api/v1/stocks:
    get:
      tags: [materials]
      summary: 库存余额
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAny"
      responses:
        "200":
          description: OK

  /api/v1/unique-codes/{code}:
    get:
      tags: [materials]
      summary: 唯一码详情
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAny"
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /api/v1/unique-codes/{code}/void:
    post:
      tags: [materials]
      summary: 作废唯一码（已签收禁止；在库/锁定会扣库存）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAny"
        - in: path
          name: code
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: OK

  /api/v1/history/alarms:
    get:
      tags: [monitor]
      summary: 告警历史快照（反代 history；MVP 按表保留、清理下迭代）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAny"
        - in: query
          name: alarmId
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK

  /internal/geofence/evaluate:
    post:
      tags: [system]
      summary: 内部定位围栏评估（需 X-Internal-Token）
      parameters:
        - $ref: "#/components/parameters/InternalToken"
      requestBody:
