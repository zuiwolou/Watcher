# =============================================================================
# Watcher 外部凭证配置模板
# -----------------------------------------------------------------------------
# 字段名与开放平台「申请到的密钥名称」对齐，申请后按同名回填。
#
# 用法：
#   1. 复制为 external_credentials.yaml（同目录，勿提交）
#   2. powershell -File tools/scripts/gen-api-key-guide.ps1
#   3. 按 docs/generated/API密钥申请说明.md 申请，回填本文件
# =============================================================================

deploy:
  admin_public_host: ""
  portal_public_host: ""
  tls_public_host: ""

# ---------- 百度地图开放平台（控制台创建应用后得到的「AK」）----------
# 应用类型见：https://lbsyun.baidu.com/
# 同步到：
#   Admin  .env → VITE_BAIDU_JAVASCRIPT_API_AK
#   Portal .env → VITE_BAIDU_JAVASCRIPT_API_AK（可与 Admin 同一把，或各建一应用）
#   Android     → --dart-define=BAIDU_ANDROID_SDK_AK=...
#   iOS         → --dart-define=BAIDU_IOS_SDK_AK=...
baidu_map:
  # 应用类型：浏览器端 → 密钥名「AK」（JavaScript API）
  javascript_api_ak: ""
  # 若 Admin / Portal 分成两个浏览器端应用，可分别填写（优先于上面的共用 AK）
  javascript_api_ak_admin: ""
  javascript_api_ak_portal: ""
  # 应用类型：Android SDK → 密钥名「AK」
  android_sdk_ak: ""
  # 应用类型：iOS SDK → 密钥名「AK」
  ios_sdk_ak: ""
  # 应用类型：服务端 → Web 服务 API 的「AK」（勿下发到浏览器）
  web_service_api_ak: ""
  # leaflet | baidu ；未填 javascript_api_ak 时仍走 Leaflet
  preferred_provider: "leaflet"

# ---------- Apple Push Notifications service (APNs) ----------
# 控制台 Keys 创建后得到：Key ID、Team ID、AuthKey_xxx.p8
apns:
  enabled: false
  # 控制台显示名：Key ID
  key_id: ""
  # Membership 页：Team ID
  team_id: ""
  # Identifiers 中的 Bundle ID
  bundle_id: ""
  # 下载的 Auth Key 文件路径（文件名形如 AuthKey_XXXXX.p8）
  auth_key_path: ""
  # sandbox | production
  environment: "sandbox"

# ---------- Firebase Cloud Messaging (FCM) ----------
# Firebase 项目设置中的 Project ID；发信用服务账号 JSON（非旧版 Server Key）
fcm:
  enabled: false
  # 项目设置 → 常规 → 项目 ID
  project_id: ""
  # 项目设置 → 服务账号 → 生成的私钥 JSON 路径
  service_account_json_path: ""
  # 添加 Android 应用后下载的 google-services.json 路径
  google_services_json_path: ""

# ---------- 国内厂商推送（各控制台密钥名）----------
vendor_push:
  # 华为 AGC：App ID / App Secret
  huawei_app_id: ""
  huawei_app_secret: ""
  # 小米推送：AppID / AppKey / AppSecret
  xiaomi_app_id: ""
  xiaomi_app_key: ""
  xiaomi_app_secret: ""
  # OPPO 推送：AppKey / AppSecret / MasterSecret
  oppo_app_key: ""
  oppo_app_secret: ""
  oppo_master_secret: ""
  # vivo 推送：AppID / AppKey / AppSecret
  vivo_app_id: ""
  vivo_app_key: ""
  vivo_app_secret: ""

# ---------- TLS 证书（Nginx 等）----------
tls:
  cert_path: ""
  key_path: ""

# ---------- 监管 SFTP ----------
sftp:
  known_hosts_path: ""
  client_private_key_path: ""
