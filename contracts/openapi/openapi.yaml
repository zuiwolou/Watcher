          application/json:
            schema:
              type: object
              required: [action, uniqueCode]
              properties:
                action: { type: string, enum: [lock, receive] }
                uniqueCode: { type: string }
                clientRequestId: { type: string }
                lat: { type: number }
                lng: { type: number }
                photoObjectKey: { type: string }
      responses:
