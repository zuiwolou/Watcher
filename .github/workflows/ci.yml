name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Tidy
        run: go mod tidy
      - name: Diff tidy
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum dirty after tidy"; git diff -- go.mod go.sum; exit 1
          fi
      - name: Unit + integration tests
        run: go test ./... -count=1 -timeout 120s
      - name: Build all services
        run: |
          go build -o bin/webhttp ./backend/cmd/webhttp
          go build -o bin/history ./backend/cmd/history
          go build -o bin/push ./backend/cmd/push
          go build -o bin/mqtt ./backend/cmd/mqtt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build admin
        working-directory: frontend/admin
        run: npm install && npm run build
      - name: Build portal
        working-directory: frontend/portal
        run: npm install && npm run build

  flutter:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get + analyze
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
