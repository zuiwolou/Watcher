<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APP · 告警</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="desk-bar">
    <div><h1>APP · 告警中心</h1><p>推送到达与列表查看；阈值配置仅在网页后台。</p></div>
    <nav class="nav-pills">
      <a href="../index.html">总览</a>
      <a href="index.html">APP首页</a>
      <a href="materials.html">物资</a>
      <a class="active" href="alarms.html">告警</a>
      <a href="monitor.html">监测</a>
      <a href="tracking.html">定位</a>
      <a href="geofence.html">围栏</a>
    </nav>
  </div>
  <div class="stage">
    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar"><span>15:02</span><span class="icons">5G · 86%</span></div>
        <div class="app-header">
          <a class="back" href="index.html">←</a>
          <h2>告警</h2>
          <a class="action" href="#" data-toast="已确认（需 alarm:ack）">确认</a>
        </div>
        <div class="content">
          <div class="card">
            <div class="list-item">
              <div class="avatar" style="background:#fef2f2;color:#b91c1c">温</div>
              <div style="flex:1">
                <div class="row"><strong style="font-size:.82rem">温度超上限</strong><span class="badge danger">紧急</span></div>
                <div class="meta">A01 · 36.2℃ &gt; 35℃ · 14:28</div>
              </div>
            </div>
            <div class="list-item">
              <div class="avatar" style="background:#ffedd5;color:#b45309">容</div>
              <div style="flex:1">
                <div class="row"><strong style="font-size:.82rem">库容接近上限</strong><span class="badge warn">重要</span></div>
                <div class="meta">占用 72% · 预警线 85%</div>
              </div>
            </div>
          </div>
          <a class="btn btn-ghost" href="../web-admin/thresholds.html">去网页后台改阈值</a>
        </div>
        <nav class="tabbar">
          <a href="index.html"><div class="ico">⌂</div>首页</a>
          <a href="materials.html"><div class="ico">物</div>物资</a>
          <a href="tracking.html"><div class="ico">运</div>定位</a>
          <a href="monitor.html"><div class="ico">监</div>监测</a>
          <a class="active" href="alarms.html"><div class="ico">警</div>告警</a>
        </nav>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
