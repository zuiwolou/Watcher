services:
  mysql:
    image: mysql:8.0
    container_name: watcher-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: watcher
      MYSQL_USER: watcher
      MYSQL_PASSWORD: watcher
    ports: ["3306:3306"]
    volumes: [watcher_mysql:/var/lib/mysql]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]

  nsqlookupd:
    image: nsqio/nsq:v1.3.0
    command: /nsqlookupd
    ports: ["4160:4160", "4161:4161"]

  nsqd:
    image: nsqio/nsq:v1.3.0
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address=nsqd
    depends_on: [nsqlookupd]
    ports: ["4150:4150", "4151:4151"]

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command: ["etcd", "-advertise-client-urls", "http://127.0.0.1:2379", "-listen-client-urls", "http://0.0.0.0:2379"]
    ports: ["2379:2379"]

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [watcher_minio:/data]

  emqx:
    image: emqx/emqx:5.8.3
    ports: ["1883:1883", "8083:8083", "18083:18083"]

  # App services expect images built locally; see deploy/compose/README.md
  # webhttp / history / push / mqtt can be run via `make run-*` on host for MVP.

volumes:
  watcher_mysql:
  watcher_minio:
