openapi: 3.0.3
info:
  title: Watcher 智能危废管控 API
  version: 0.3.0
  description: |
    WebHTTP 对外 REST（MVP 0.3 与代码对齐）。

    **约定**
    - 统一响应：`{ code, message?, data?, requestId? }`；分页在 `data.{ list, page, pageSize, total }`
    - 鉴权：`Authorization: Bearer <accessToken>`
    - 端标识：`X-Client: admin | portal | app`（业务路由需三者之一；IAM/设备/Schema/对接仅 `admin`）
    - 幂等：执行类 body `clientRequestId` 或头 `X-Idempotency-Key`
    - 本文件以 `backend/cmd/webhttp/main.go` 注册表为准

    **演示监管凭证**：`open-demo` / `OpenDemo@123`（Basic 或 X-Open-Client-Id/Secret）

    **已知未实现（见 docs/plan/缺口评估与迭代计划.md）**
    - 监管字段映射配置化、真 SFTP
    - 盘点过账差异调账已实现（missing→void+扣库存；surplus 仅记录）
servers:
  - url: http://127.0.0.1:8080
    description: 本地 webhttp
tags:
  - name: system
  - name: auth
  - name: iam
  - name: media
  - name: materials
  - name: inbound
  - name: outbound
  - name: transport
  - name: inventory
  - name: approval
  - name: inspection
  - name: alarm
  - name: monitor
  - name: mqtt
  - name: openapi
  - name: device
  - name: realtime

paths:
  /healthz:
    get:
      tags: [system]
      summary: 健康检查
      responses:
        "200":
          description: OK

  /internal/monitor/evaluate:
    post:
      tags: [system]
      summary: 内部遥测阈值评估（需 X-Internal-Token）
      parameters:
        - $ref: "#/components/parameters/InternalToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                warehouseId: { type: string }
                deviceId: { type: string }
                metric: { type: string }
                value: { type: number }
      responses:
        "200":
          description: OK

  /v1/stream:
    get:
      tags: [realtime]
      summary: WebSocket 反代至 push（Protobuf 下行）
      description: |
        升级为 WebSocket。JWT 可通过 `Authorization` 或 query `token` / `access_token`。
        需 `X-Client`（握手前 HTTP 头）为 admin|portal|app。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClient"
        - in: query
          name: token
          schema: { type: string }
          description: 可选，浏览器无法带头时用
      responses:
        "101":
          description: Switching Protocols

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                mode: { type: string, enum: [local, ldap], default: local }
      responses:
        "200":
          description: OK（含 accessToken / refreshToken / mustChangePassword / clients）

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: OK

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: 修改密码（含强制改密）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string }
      responses:
        "200":
          description: OK

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出并吊销 Refresh Token
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                all: { type: boolean }
      responses:
        "200":
          description: OK

  /api/v1/open/materials:
    get:
      tags: [openapi]
      summary: 监管入站-物资列表（独立凭证）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK

  /api/v1/open/stocks:
    get:
      tags: [openapi]
      summary: 监管入站-库存快照
      responses:
        "200":
          description: OK

  /api/v1/open/alarms:
    get:
      tags: [openapi]
      summary: 监管入站-告警查询
      responses:
        "200":
          description: OK

  /api/v1/open/unique-codes:
    get:
      tags: [openapi]
      summary: 监管入站-唯一码台账
      responses:
        "200":
          description: OK

  /api/v1/materials/{id}:
    put:
      tags: [materials]
      summary: 更新物资
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAny"
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: OK

  /api/v1/unique-codes:
    get:
      tags: [materials]
