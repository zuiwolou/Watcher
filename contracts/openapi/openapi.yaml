      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAny"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK

  /api/v1/unique-codes/export:
    get:
