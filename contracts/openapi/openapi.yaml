          description: OK

  /api/v1/devices/{id}/mqtt-binding:
    put:
      tags: [device]
      summary: 绑定 MQTT Schema
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAdmin"
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: OK

  /api/v1/media/upload-url:
    post:
      tags: [media]
      summary: MinIO 预签名 PUT URL
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAny"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType: { type: string }
                ext: { type: string }
      responses:
        "200":
          description: OK（uploadUrl / objectKey）

  /api/v1/warehouses:
    get:
      tags: [materials]
      summary: 仓库列表
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAny"
      responses:
        "200":
          description: OK

  /api/v1/materials:
    get:
      tags: [materials]
      summary: 物资列表
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAny"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
