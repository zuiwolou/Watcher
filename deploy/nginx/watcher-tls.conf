# Watcher Nginx + TLS 样例
# 用法：把 cert/key 换成你们的路径；server_name 换成真实域名。
# 证书路径可与 configs/external_credentials.yaml 中 tls.cert_path / tls.key_path 对齐。

upstream watcher_webhttp {
    server 127.0.0.1:8080;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name watcher.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name watcher.example.com;

    ssl_certificate     /etc/watcher/tls/fullchain.pem;
    ssl_certificate_key /etc/watcher/tls/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Admin 静态（打包产物 web/admin）
    location /admin/ {
        alias /opt/watcher/web/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /portal/ {
        alias /opt/watcher/web/portal/;
        try_files $uri $uri/ /portal/index.html;
    }

    location /api/ {
        proxy_pass http://watcher_webhttp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WSS：经 webhttp 鉴权后再反代 push；浏览器 Origin 须在 WATCHER_WS_ORIGINS 白名单
    location /v1/stream {
        proxy_pass http://watcher_webhttp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
    }
}
