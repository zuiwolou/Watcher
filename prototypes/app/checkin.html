<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APP · 运输打卡</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="desk-bar">
    <div>
      <h1>APP · 运输打卡（执行）</h1>
      <p>扫唯一码 + 拍照 + 自动定位 · 后台仅查看记录，不在后台打卡</p>
    </div>
    <nav class="nav-pills">
      <a href="../index.html">总览</a>
      <a href="index.html">APP首页</a>
      <a class="active" href="checkin.html">打卡</a>
      <a href="inventory.html">盘点</a>
      <a href="scan-io.html">入出库</a>
    </nav>
  </div>
  <div class="stage">
    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar"><span>15:20</span><span class="icons">5G · 86%</span></div>
        <div class="app-header">
          <a class="back" href="index.html">←</a>
          <h2>运输打卡</h2>
          <a class="action" href="tracking.html">地图</a>
        </div>
        <div class="content">
          <div class="card">
            <div class="row">
              <h4 style="margin:0">任务 YS-20261015-07</h4>
              <span class="badge warn">途经</span>
            </div>
            <div class="meta">粤B·D8231 · 联单 YF20261015018<br/>后台已关联出库单，本页执行打卡</div>
          </div>
          <div class="steps">
            <div class="s done">发车</div>
            <div class="s current">途经</div>
            <div class="s">到达</div>
            <div class="s">签收</div>
          </div>
          <div class="scan-frame">
            <div class="box"></div>
            <p>扫描物料唯一码</p>
          </div>
          <div class="card">
            <h4>物料信息</h4>
            <div class="meta">HW31-…-00102 · 废铅蓄电池 · 0.034t</div>
          </div>
          <div class="card">
            <h4>现场照片</h4>
            <div class="photo-slot filled">已拍摄 · 装载全景</div>
            <div class="field">
              <label>打卡节点</label>
              <select><option>途经打卡</option><option>发车</option><option>到达</option><option>异常</option></select>
            </div>
            <div class="field">
              <label>实时位置（自动）</label>
              <input value="22.547°N, 114.085°E · 精度 8m" readonly />
            </div>
            <button class="btn btn-primary" data-toast="打卡成功，已同步前台地图轨迹">提交打卡</button>
          </div>
        </div>
        <nav class="tabbar">
          <a href="index.html"><div class="ico">⌂</div>首页</a>
          <a class="active" href="checkin.html"><div class="ico">执</div>执行</a>
          <a href="tracking.html"><div class="ico">运</div>定位</a>
          <a href="monitor.html"><div class="ico">监</div>监测</a>
          <a href="alarms.html"><div class="ico">警</div>告警</a>
        </nav>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
