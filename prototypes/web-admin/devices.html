    <main class="main">
      <div class="page-title">
        <div><h1>监测设备与对接</h1><p>网关 / 传感器 / 摄像头注册 · 监管 OpenAPI 开关</p></div>
        <button class="btn btn-primary" data-toast="设备注册成功">注册设备</button>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>设备 ID</th><th>类型</th><th>所属仓</th><th>链路</th><th>状态</th></tr></thead>
          <tbody>
            <tr><td>GW-A01</td><td>IoT 网关</td><td>A01</td><td>公网 4G + 局域网备份</td><td><span class="badge ok">在线</span></td></tr>
            <tr><td>TH-01</td><td>温湿度</td><td>A01</td><td>经网关 MQTT</td><td><span class="badge ok">在线</span></td></tr>
            <tr><td>CAM-01</td><td>摄像头</td><td>A01 入口</td><td>ONVIF → HLS</td><td><span class="badge ok">在线</span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="card">
        <h3>监管对接</h3>
        <div class="perm-item on" style="max-width:420px"><span>启用 OpenAPI 推送台账/告警</span><div class="switch on"></div></div>
        <p class="note">字段映射与证书配置属高级项，仅系统管理员。</p>
      </div>
