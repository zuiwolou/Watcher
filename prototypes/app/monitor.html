<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APP · 智能监测</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="desk-bar">
    <div><h1>APP · 智能监测（只读）</h1><p>多源环境数据可视化，设备配置在后台。</p></div>
    <nav class="nav-pills">
      <a href="../index.html">总览</a>
      <a href="index.html">APP首页</a>
      <a href="materials.html">物资</a>
      <a href="alarms.html">告警</a>
      <a class="active" href="monitor.html">监测</a>
      <a href="tracking.html">定位</a>
      <a href="geofence.html">围栏</a>
    </nav>
  </div>
  <div class="stage">
    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar"><span>15:02</span><span class="icons">5G · 86%</span></div>
        <div class="app-header">
          <a class="back" href="index.html">←</a>
          <h2>智能监测</h2>
        </div>
        <div class="content">
          <div class="metric-grid">
            <div class="metric"><div class="l">温度</div><div class="v hot">36.2℃</div><div class="s">超限</div></div>
            <div class="metric"><div class="l">湿度</div><div class="v">62%</div><div class="s">正常</div></div>
            <div class="metric"><div class="l">水浸</div><div class="v" style="font-size:1rem;color:var(--ok)">正常</div></div>
            <div class="metric"><div class="l">入侵</div><div class="v" style="font-size:1rem;color:var(--ok)">安全</div></div>
          </div>
          <div class="card" style="margin-top:12px">
            <h4>温度曲线</h4>
            <div class="chart"><i style="height:40%"></i><i style="height:50%"></i><i style="height:65%"></i><i style="height:90%;background:linear-gradient(180deg,#b91c1c,#f87171)"></i></div>
          </div>
          <div class="card">
            <h4>视频 · 入口</h4>
            <div class="video-box"><div class="play">▶</div></div>
          </div>
        </div>
        <nav class="tabbar">
          <a href="index.html"><div class="ico">⌂</div>首页</a>
          <a href="materials.html"><div class="ico">物</div>物资</a>
          <a href="tracking.html"><div class="ico">运</div>定位</a>
          <a class="active" href="monitor.html"><div class="ico">监</div>监测</a>
          <a href="alarms.html"><div class="ico">警</div>告警</a>
        </nav>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
