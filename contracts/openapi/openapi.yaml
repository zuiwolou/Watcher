          description: OK
    post:
      tags: [device]
      summary: 创建设备
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/XClientAdmin"
      responses:
        "200":
          description: OK

  /api/v1/devices/{id}:
