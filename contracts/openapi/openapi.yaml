components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XClient:
      name: X-Client
      in: header
      schema: { type: string, enum: [admin, portal, app] }
    XClientAdmin:
      name: X-Client
      in: header
      required: true
      schema: { type: string, enum: [admin] }
    XClientAny:
      name: X-Client
      in: header
      required: true
      schema: { type: string, enum: [admin, portal, app] }
    InternalToken:
      name: X-Internal-Token
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      schema: { type: string }
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    ApiEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: {}
        requestId: { type: string }
    PageData:
      type: object
      properties:
        list: { type: array, items: {} }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
    ExecConfirmBody:
      type: object
      required: [uniqueCode]
      properties:
        uniqueCode: { type: string }
        clientRequestId: { type: string }
        lat: { type: number }
        lng: { type: number }
        photoObjectKey: { type: string }
    CheckinBody:
      type: object
      required: [taskId, nodeType]
      properties:
        taskId: { type: integer, format: int64 }
        nodeType: { type: string, enum: [depart, waypoint, arrive] }
        uniqueCode: { type: string }
        clientRequestId: { type: string }
        lat: { type: number }
        lng: { type: number }
        photoObjectKey: { type: string }
        remark: { type: string }
    InspCheckinBody:
      type: object
      required: [pointId]
      properties:
        pointId: { type: integer, format: int64 }
        status: { type: string, enum: [done, abnormal] }
        remark: { type: string }
        clientRequestId: { type: string }
        lat: { type: number }
        lng: { type: number }
        photoObjectKey: { type: string }
